name: Windows CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test-and-package:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run tests
        run: npm test
      - name: Check Electron main process
        run: node --check main.cjs
      - name: Audit source release safety
        run: npm run audit:release
      - name: Build Windows installer
        run: npm run dist
      - name: Audit packaged output
        run: node scripts/audit-release.cjs dist/win-unpacked
